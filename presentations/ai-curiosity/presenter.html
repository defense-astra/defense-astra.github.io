<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>발표자 화면</title><link rel="stylesheet" href="docs.css"></head><body><main><nav><a href="speaker.html" target="_blank">전체 대본</a><span id="timer">00:00</span><button id="reset">타이머 초기화</button></nav><p class="eyebrow" id="meta">발표 화면의 노트에서 이 창을 열어 주세요.</p><h1 id="title">발표자 화면</h1><p class="cue" id="cue"></p><p id="script"></p><p class="next" id="next-title"></p><nav><button id="prev">← 이전 장표</button><button id="next">다음 장표 →</button></nav><p class="small">청중 화면에는 장표 창만 표시하세요. 이 창은 두 번째 화면이나 별도 모니터에 두면 됩니다.</p></main><script src="slides.js"></script><script>
(()=>{const $=x=>document.getElementById(x),tm=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');function send(command){window.opener?.postMessage({type:'deck-command',command},'*');}window.addEventListener('message',e=>{if(e.source!==window.opener||e.data?.type!=='deck-state')return;const i=e.data.index,s=SLIDES[i],start=SLIDES.slice(0,i).reduce((n,x)=>n+x.seconds,0);$('meta').textContent=`${i+1} / 32 · 목표 ${tm(start)}–${tm(start+s.seconds)} · ${s.seconds}초`;$('title').textContent=s.title.replace(/\n/g,' ');$('script').textContent=s.note;$('cue').textContent=s.cue;$('timer').textContent=tm(e.data.elapsed);$('next-title').textContent=i<31?'다음: '+SLIDES[i+1].title.replace(/\n/g,' '):'마지막 장표입니다.';});$('prev').onclick=()=>send('prev');$('next').onclick=()=>send('next');$('reset').onclick=()=>send('reset-timer');window.opener?.postMessage({type:'presenter-ready'},'*');})();
</script></body></html>
