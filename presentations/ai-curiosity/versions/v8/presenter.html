<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>발표자 화면</title><link rel="stylesheet" href="docs.css"><style>.step-state{padding:14px 18px;background:#e6efdf;border-left:4px solid #496b3d;font-weight:600;line-height:1.5}.presenter-actions{flex-wrap:wrap;gap:10px}.presenter-actions button{min-width:145px}.shortcut-hint{font-size:14px;color:#4c625c;line-height:1.8}button:disabled{opacity:.35}</style></head><body><main><nav><a href="speaker.html" target="_blank">전체 대본</a><span id="timer">00:00</span><button id="reset">타이머 초기화</button></nav><p class="eyebrow" id="meta">발표 화면의 노트에서 이 창을 열어 주세요.</p><h1 id="title">발표자 화면</h1><p id="step-state" class="step-state" role="status">발표 화면과 연결 중</p><p class="cue" id="cue"></p><p id="script"></p><p class="next" id="next-title"></p><nav class="presenter-actions"><button id="prev">← 이전 단계 / 장표</button><button id="next">다음 단계 / 장표 →</button><button id="skip-prev">이전 장표로</button><button id="skip-next">다음 장표로</button></nav><p class="shortcut-hint">포인터의 다음 / 이전 버튼으로 애니메이션 단계를 진행합니다. 마지막 단계 다음에는 다음 장표로 넘어갑니다.<br>Page Down·→·↓·Space·Enter: 다음 / Page Up·←·↑·Shift+Space·Backspace: 이전<br>Shift+방향키: 장표 건너뛰기 · Home/End: 처음/끝</p><p class="small">청중 화면에는 장표 창만 표시하세요. 이 창은 두 번째 화면이나 별도 모니터에 두면 됩니다.</p></main><script src="slides.js"></script><script>
(()=>{'use strict';const $=x=>document.getElementById(x),tm=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');function send(command){window.opener?.postMessage({type:'deck-command',command},'*');}
window.addEventListener('message',e=>{if(e.source!==window.opener||e.data?.type!=='deck-state')return;const i=e.data.index,s=SLIDES[i],n=e.data.navigation||{index:0,count:1,label:''};$('meta').textContent=`${i+1} / ${SLIDES.length}`;$('title').textContent=s.title.replace(/\n/g,' ');$('script').textContent=s.note;$('cue').textContent=s.cue;$('timer').textContent=tm(e.data.elapsed);$('step-state').textContent=n.ready===false?'애니메이션 준비 중':n.count>1?`${n.index+1} / ${n.count} 단계 · ${n.label}${n.playing?' · 재생 중':''}`:'다음 버튼: 다음 장표';$('prev').disabled=e.data.hasPrevious===false;$('next').disabled=e.data.hasNext===false;$('skip-prev').disabled=i===0;$('skip-next').disabled=i===SLIDES.length-1;$('next-title').textContent=i<SLIDES.length-1?'다음 장표: '+SLIDES[i+1].title.replace(/\n/g,' '):'마지막 장표입니다.';});
['prev','next','skip-prev','skip-next'].forEach(id=>$(id).onclick=()=>send(id));$('reset').onclick=()=>send('reset-timer');
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||e.target.isContentEditable||e.target.closest?.('input,textarea,select,[role="textbox"]'))return;const k=e.key.toLowerCase();let cmd;if(['arrowright','arrowdown','pagedown'].includes(k))cmd=e.shiftKey?'skip-next':'next';if(['arrowleft','arrowup','pageup'].includes(k))cmd=e.shiftKey?'skip-prev':'prev';if(k===' '||k==='spacebar')cmd=e.shiftKey?'prev':'next';if(k==='enter')cmd='next';if(k==='backspace')cmd='prev';if(k==='home')cmd='first';if(k==='end')cmd='last';if(k==='a')cmd='animate';if(!cmd)return;e.preventDefault();e.stopImmediatePropagation();if(!e.repeat)send(cmd);},true);
window.opener?.postMessage({type:'presenter-ready'},'*');})();
</script></body></html>
